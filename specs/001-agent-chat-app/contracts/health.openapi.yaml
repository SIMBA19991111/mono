openapi: 3.0.3
info:
  title: Agent Chat Health API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Service health/status check
      operationId: getHealth
      responses:
        "200":
          description: Backend process is up and healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
